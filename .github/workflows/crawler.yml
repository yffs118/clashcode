# .github/workflows/crawler.yml
name: Crawler Scheduled Task

on:
  schedule:
    - cron: '0 5 * * *'   # 每天 UTC 5:00 运行（北京时间 13:00）
  workflow_dispatch:

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 授予写权限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0   # 拉取所有历史，以便后续操作

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 pyyaml

      # ====== 新增：先拉取远程最新代码（此时工作区干净） ======
      - name: Pull latest changes
        run: git pull origin main --rebase

      - name: Run crawler
        run: python crawler_pro.py

      - name: Commit and push output files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 添加文件
          git add crawclash.yaml crawsub.txt || echo "No files to add"
          # 如果有变更则提交
          git diff --staged --quiet || git commit -m "Update node configs $(date +'%Y-%m-%d %H:%M')"
          # 推送
          git push origin main
